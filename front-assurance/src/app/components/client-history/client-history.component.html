<div class="history-container">
  <div class="header">
    <h2>Historique de Discussion</h2>
    <button class="back-btn" routerLink="/chatbot">← Retour au Chatbot</button>
  </div>

  <div class="date-filter">
    <div class="filter-group">
      <div class="custom-date-field">
        <label for="startDate">Date de début</label>
        <input type="date" id="startDate" [(ngModel)]="startDate" placeholder="jj/mm/aaaa">
      </div>

      <div class="custom-date-field">
        <label for="endDate">Date de fin</label>
        <input type="date" id="endDate" [(ngModel)]="endDate" placeholder="jj/mm/aaaa">
      </div>
    </div>

    <button (click)="applyFilter()" class="filter-btn">Filtrer</button>
  </div>

  <table class="history-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Utilisateur</th>
        <th>Message Client</th>
        <th>Réponse Bot</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let pair of groupedMessages">
        <td>{{ pair.user.created_at | date:'dd/MM/yyyy à HH:mm' }}</td>
        <td class="user-cell">
          <i class="fas fa-user-circle"></i> {{ pair.user.username }}
        </td>
        <td>{{ pair.user.text }}</td>
        <td>{{ parseBotReply(pair.bot.text) }}</td>
      </tr>
    </tbody>
  </table>

  <div class="pagination-container">
    <div class="pagination">
      <button (click)="prevPage()" [disabled]="currentPage === 1">⬅ Précédent</button>
     <span>Page {{ currentPage }} / {{ totalPages }}</span>

      <button (click)="nextPage()" [disabled]="!hasMore">Suivant ➡</button>
    </div>
  </div>
</div>
